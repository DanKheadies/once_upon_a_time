name: once_upon_a_time
description: "Stories retold from a new perspective. Can you figure out the what and who?"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  animated_text_kit: ^4.3.0
  bloc: ^9.2.1
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  firebase_core: ^4.12.1
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/storybook-floor-square.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/storybook.png"
  web:
    generate: true
    image_path: "assets/images/storybook.png"
    background_color: "#121212"
    theme_color: "#e2c08e"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/vids/

  fonts:
    - family: HoldMoney
      fonts:
        - asset: assets/fonts/HoldMoney-Regular.ttf

  shaders:
    - assets/shaders/fbs_gradient.frag
    - assets/shaders/page_curl.frag
    - assets/shaders/parchment.frag
