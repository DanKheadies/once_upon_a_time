name: once_upon_a_time
description: "Stories retold from a new perspective. Can you figure out the what and who?"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # flutter_web_plugins:
  #   sdk: flutter

  animated_text_kit: ^4.3.0
  bloc: ^9.2.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  cupertino_icons: ^1.0.8
  email_validator: ^3.0.0
  equatable: ^2.1.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  hydrated_bloc: ^11.0.0
  intl: ^0.20.3
  logger: ^2.7.0
  path_provider: ^2.1.6
  video_player: ^2.13.0
  vph_web_date_picker: ^0.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/storybook-floor-square.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/storybook.png"
  web:
    generate: true
    image_path: "assets/images/storybook.png"
    background_color: "#121212"
    theme_color: "#e2c08e"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/vids/

  fonts:
    - family: Alagard
      fonts:
        - asset: assets/fonts/alagard.ttf
    - family: HoldMoney
      fonts:
        - asset: assets/fonts/HoldMoney-Regular.ttf
    - family: Storybook
      fonts:
        - asset: assets/fonts/Storyboo.TTF

  shaders:
    # - assets/shaders/anime_fire.frag
    # - assets/shaders/fbs_gradient.frag
    - assets/shaders/instanced_shape_morph.frag
    - assets/shaders/logo_tint.frag
    # - assets/shaders/page_curl.frag
    - assets/shaders/parchment_page.frag
    - assets/shaders/pixelate.frag
    # - assets/shaders/shape_morph.frag
